<p-toolbar styleClass="mb-6">
  <ng-template #start>
    <p-button *appCanDo="{ menuKey: 'SEGURIDAD', submenuKey: 'USUARIOS', actionKey: 'CREATE' }" label="Nuevo" icon="pi pi-plus" severity="secondary" class="mr-2" (onClick)="openNew()" />
    <p-button severity="secondary" label="Eliminar" icon="pi pi-trash" outlined (onClick)="deleteSelectedUsers()"
      [disabled]="!canDeleteUser() || !selectedUsers || !selectedUsers.length" [pTooltip]="permissionTooltip(canDeleteUser())" tooltipPosition="top" />
  </ng-template>

  <ng-template #end>
    <p-button label="Exportar" icon="pi pi-upload" severity="secondary" (onClick)="exportCSV()" />
  </ng-template>
</p-toolbar>

<p-table #dt [value]="users()" [rows]="10" [columns]="cols" [paginator]="true" [totalRecords]="totalRecords"
  [lazy]="true" (onPage)="onPage($event)" [loading]="loading" [tableStyle]="{ 'min-width': '75rem' }"
  [(selection)]="selectedUsers" [rowHover]="true" dataKey="id"
  currentPageReportTemplate="Mostrando {first} de {last} de {totalRecords} usuarios" [showCurrentPageReport]="true"
  [rowsPerPageOptions]="[10, 20, 30]">
  <ng-template #caption>
    <div class="flex items-center justify-between flex-wrap gap-4">
      <h5 class="m-0">Mantenimiento de usuarios</h5>
      <div class="flex items-end gap-4 flex-wrap">
        <div class="flex flex-col gap-2">
          <input id="firstnameFilter" pInputText type="text" [(ngModel)]="firstnameFilter" (input)="onFirstNameFilter()" placeholder="Buscar por nombre" />
        </div>
        <div class="flex flex-col gap-2">
          <input id="lastnameFilter" pInputText type="text" [(ngModel)]="lastnameFilter" (input)="onLastNameFilter()" placeholder="Buscar por apellido" />
        </div>
        <div class="flex items-center gap-2">
          <p-radioButton name="status" [(ngModel)]="statusFilter" [value]="null" inputId="statusAll" (onClick)="onStatusChange()"></p-radioButton>
          <label for="statusAll">Todos</label>
          <p-radioButton name="status" [(ngModel)]="statusFilter" [value]="'ACTIVE'" inputId="statusActive" (onClick)="onStatusChange()"></p-radioButton>
          <label for="statusActive">Activos</label>
          <p-radioButton name="status" [(ngModel)]="statusFilter" [value]="'INACTIVE'" inputId="statusInactive" (onClick)="onStatusChange()"></p-radioButton>
          <label for="statusInactive">Inactivos</label>
        </div>
      </div>
    </div>
  </ng-template>

  <ng-template #header>
    <tr>
      <th style="width: 3rem">
        <p-tableHeaderCheckbox />
      </th>
      <th style="min-width: 8rem">ID</th>
      <th pSortableColumn="username" style="min-width: 12rem">
        Usuario
        <p-sortIcon field="username" />
      </th>
      <th style="min-width: 14rem">Email</th>
      <th style="min-width: 12rem">Nombre</th>
      <th style="min-width: 12rem">Apellido</th>
      <th pSortableColumn="status" style="min-width: 10rem">
        Estado
        <p-sortIcon field="status" />
      </th>
      <th style="min-width: 12rem"></th>
    </tr>
  </ng-template>
  <ng-template #body let-user>
    <tr>
      <td style="width: 3rem">
        <p-tableCheckbox [value]="user" />
      </td>
      <td style="min-width: 8rem">{{ user.id }}</td>
      <td style="min-width: 12rem">{{ user.username }}</td>
      <td style="min-width: 14rem">{{ user.email }}</td>
      <td style="min-width: 12rem">{{ user.firstname }}</td>
      <td style="min-width: 12rem">{{ user.lastname }}</td>
      <td>
        <p-tag [value]="user.status" [severity]="user.status === 'ACTIVE' ? 'success' : 'danger'"></p-tag>
      </td>
      <td>
        <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true" (click)="editUser(user)"
          [disabled]="!canUpdateUser()" [pTooltip]="permissionTooltip(canUpdateUser())" tooltipPosition="top" />
        <p-button *ngIf="user.status !== 'INACTIVE'" icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" (click)="deleteUser(user)"
          [disabled]="!canDeleteUser()" [pTooltip]="permissionTooltip(canDeleteUser())" tooltipPosition="top" />
        <p-button *ngIf="user.status === 'INACTIVE'" icon="pi pi-refresh" severity="success" [rounded]="true" [outlined]="true" (click)="reactivateUser(user)"
          [disabled]="!canReactivateUser()" [pTooltip]="permissionTooltip(canReactivateUser())" tooltipPosition="top" />
      </td>
    </tr>
  </ng-template>
</p-table>

<p-dialog [(visible)]="userDialog" [style]="{ width: '600px' }" header="Detalle del usuario" [modal]="true">
  <ng-template #content>
    <div class="flex flex-col justify-content-center align-items-center gap-6">
      <div class="w-full">
        <label for="username" class="block font-bold mb-3">Usuario</label>
        <input type="text" pInputText id="username" [(ngModel)]="user.username" required autofocus class="w-full" />
        <small class="text-red-500" *ngIf="submitted && !user.username">El usuario es requerido.</small>
      </div>

      <div class="w-full">
        <label for="email" class="block font-bold mb-3">Email</label>
        <input type="email" pInputText id="email" [(ngModel)]="user.email" required class="w-full" />
      </div>

      <div class="w-full">
        <label for="firstname" class="block font-bold mb-3">Nombre</label>
        <input type="text" pInputText id="firstname" [(ngModel)]="user.firstname" required class="w-full" />
      </div>

      <div class="w-full">
        <label for="lastname" class="block font-bold mb-3">Apellido</label>
        <input type="text" pInputText id="lastname" [(ngModel)]="user.lastname" required class="w-full" />
      </div>

      <div class="w-full" *ngIf="!editingId">
        <label for="password" class="block font-bold mb-3">Password</label>
        <input type="password" pInputText id="password" [(ngModel)]="user.password" class="w-full" />
      </div>

      <div class="w-full">
        <label for="roles" class="block font-bold mb-3">Roles</label>
        <p-multiSelect id="roles" [options]="roles" optionLabel="name" optionValue="id"
          [(ngModel)]="user.roleIds" defaultLabel="Selecciona roles" display="chip" class="w-full"
          appendTo="body" [panelStyle]="{ minWidth: '24rem', maxHeight: '20rem' }" />
      </div>
    </div>
  </ng-template>

  <ng-template #footer>
    <div class="flex justify-content-center gap-3 w-full">
      <p-button label="Cancelar" icon="pi pi-times" text (click)="hideDialog()" />
      <p-button label="Guardar" icon="pi pi-check" (click)="saveUser()" />
    </div>
  </ng-template>
</p-dialog>

<p-confirmdialog [style]="{ width: '450px' }" />
